spring:
  application:
    name: murder-mystery
  datasource:
    url: jdbc:postgresql://localhost:5432/murdermystery
    username: murdermystery
    password: murdermystery
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
