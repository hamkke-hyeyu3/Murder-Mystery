spring:
  application:
    name: murder-mystery
  datasource:
    url: jdbc:postgresql://localhost:5432/murdermystery
    username: murdermystery
    password: murdermystery
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173
  scenarios:
    patterns: "classpath:scenarios/*.json"
  tutorial:
    enter-delay-ms: 5000
